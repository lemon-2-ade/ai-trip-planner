name: Dockerized Next.js CI/CD to EC2

on:
  push:
    branches:
      - main # Trigger workflow on push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 3: Build the Docker image
    - name: Build Docker Image
      run: >
        docker build
        --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}"
        --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}"
        --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}"
        --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
        --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}"
        --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}"
        --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}"
        --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}"
        --build-arg GOOGLE_PLACES_API_KEY="${{ secrets.GOOGLE_PLACES_API_KEY }}"
        --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}"
        --build-arg NEXT_PUBLIC_GOOGLE_MAP_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}"
        --build-arg OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
        -t ${{ secrets.DOCKER_USERNAME }}/travel-app:latest .

    # Step 4: Push the Docker image to DockerHub
    - name: Push Docker Image to DockerHub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/travel-app:latest
      
    # Step 5: Deploy the Docker image to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          APP_NAME="travel-app"
          APP_DIR="/home/ubuntu/$APP_NAME"

          # Pull the latest Docker image from DockerHub
          echo "Pulling the latest Docker image..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/travel-app:latest

          # Stop and remove the existing container if it exists
          if [ $(docker ps -q -f name=$APP_NAME) ]; then
            echo "Stopping existing container..."
            docker stop $APP_NAME
            docker rm $APP_NAME
          fi

          # Run the new container
          echo "Starting new container..."
          docker run -d \
            --name $APP_NAME \
            -p 3000:3000 \
            --restart always \
            --env-file $APP_DIR/.env \
            ${{ secrets.DOCKER_USERNAME }}/travel-app:latest

          # Verify container is running
          echo "Deployment successful. The application is now running."
