name: Dockerized Next.js CI/CD to EC2

on:
  push:
    branches:
      - main # Trigger workflow on push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 5: Deploy the Docker image to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          APP_NAME="travel-app"
          APP_DIR="/home/ubuntu/$APP_NAME"

          # Pull the latest Docker image from DockerHub
          echo "Pulling the latest Docker image..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/travel-app:latest

          # Stop and remove the old container
          echo "Stopping and removing old container..."
          docker stop $APP_NAME || true
          docker rm $APP_NAME || true

          # Run the new container
          echo "Starting new container..."
          docker run -d \
            --name $APP_NAME \
            -p 3000:3000 \
            --restart always \
            --env-file $APP_DIR/.env \
            ${{ secrets.DOCKER_USERNAME }}/travel-app:latest

          echo "Deployment successful. The application is now running."
