name: Dockerized Next.js CI/CD to EC2

on:
  push:
    branches:
      - main # Auto-deploys on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy with Docker on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          APP_NAME="travel-app"
          APP_DIR="/home/ubuntu/$APP_NAME"
          
          # 1. Navigate to app directory and pull latest code
          cd $APP_DIR
          git pull origin main
          
          # 2. Build the new Docker image
          echo "Building new Docker image..."
          docker build -t $APP_NAME:latest .
          
          # 3. Stop and remove the old container
          echo "Stopping and removing old container..."
          docker stop $APP_NAME || true
          docker rm $APP_NAME || true
          
          # 4. Run the new container (port 3000 is exposed to the host)
          echo "Starting new container..."
          docker run -d \
            --name $APP_NAME \
            -p 3000:3000 \
            --restart always \
            $APP_NAME:latest
          
          echo "Deployment successful. The application is now running."